name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm test
      - name: Verify web/dist is up to date
        run: |
          python3 tools/build.py --out /tmp/black-order.html
          cmp /tmp/black-order.html web/dist/black-order.html
